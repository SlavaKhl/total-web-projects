<script>
  // Send visitors to their language: saved choice, then browser language, then Latvian.
  (function () {
    var l = null;
    try { l = localStorage.getItem('nl-lang'); } catch (e) {}
    if (!l) l = /^ru\b/i.test(navigator.language || '') ? 'ru' : 'lv';
    location.replace((l === 'ru' ? 'ru' : 'lv') + '/index.html');
  })();
</script>
